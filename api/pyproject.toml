[project]
name = "finesg-api"
version = "0.1.0"
description = "FinESG Planner — sàng lọc sơ bộ danh mục CapEx xanh"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.140.13",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.52.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finesg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
